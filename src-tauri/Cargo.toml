[package]
name = "recalldesk"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.5"
tauri-plugin-shell = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Gmail API
reqwest = { version = "0.12", features = ["json"] }
oauth2 = "4.4"

# File System
notify = "6.0"
walkdir = "2.4"
mime = "0.3"

# PDF extraction
pdfium-render = { version = "0.8", optional = true }

# DOCX extraction (ZIP-based format)
zip = { version = "0.6", optional = true }

# Encoding
base64 = "0.21"
urlencoding = "2.1"

# Security (Keychain)
keyring = "2.1"

# Utilities
regex = "1.10"
url = "2.5"

[features]
default = ["pdf", "docx"]
pdf = ["pdfium-render"]
docx = ["dep:zip"]

[dev-dependencies]
mockall = "0.12"
tempfile = "3.8"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
